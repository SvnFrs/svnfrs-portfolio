name: Build and Deploy Portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      GIT_REGISTRY: ghcr.io/${{ github.repository }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert REGISTRY to lowercase
        run: echo "REGISTRY=$(echo $GIT_REGISTRY | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and push Docker image
        run: |
          docker compose -f .docker/compose.build.yaml --profile build build --parallel
          docker compose -f .docker/compose.build.yaml --profile build push

  deploy-website:
    runs-on: ubuntu-latest
    needs: build-image
    env:
      GIT_REGISTRY: ghcr.io/${{ github.repository }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Convert REGISTRY to lowercase
        run: echo "REGISTRY=$(echo $GIT_REGISTRY | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            # Prepare directory
            mkdir -p ~/portfolio-deployment/.docker

            # Pull the latest code
            cd ~/portfolio-deployment
            echo "${{ env.REGISTRY }}" > .registry

            # Create/update environment file
            cat > .env << EOF
            REGISTRY=${{ env.REGISTRY }}
            ROOT_DOMAIN=${{ secrets.ROOT_DOMAIN }}
            CF_API_TOKEN=${{ secrets.CF_API_TOKEN }}
            ZONE_ID=${{ secrets.ZONE_ID }}
            CLOUDFLARE_TUNNEL_TOKEN=${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
            EOF

            # Copy the docker-compose file
            cat > .docker/compose.yaml << 'EOF'
            ${{ needs.build-image.outputs.compose_content }}
            EOF

            # Pull images and deploy
            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
            docker compose -f .docker/compose.yaml -p svnfrs-portfolio --profile prod pull
            docker compose -f .docker/compose.yaml -p svnfrs-portfolio --profile prod up -d

            # Clean up unused images
            docker system prune -af

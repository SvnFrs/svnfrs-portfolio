name: Build and Deploy Portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      GIT_REGISTRY: ghcr.io/${{ github.repository }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert REGISTRY to lowercase
        run: echo "REGISTRY=$(echo $GIT_REGISTRY | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and push Docker image
        run: |
          docker compose -f .docker/compose.build.yaml --profile build build --parallel
          docker compose -f .docker/compose.build.yaml --profile build push

  deploy-website:
    runs-on: ubuntu-latest
    needs: build-image
    env:
      GIT_REGISTRY: ghcr.io/${{ github.repository }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Convert REGISTRY to lowercase
        run: echo "REGISTRY=$(echo $GIT_REGISTRY | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            # Prepare directory
            mkdir -p ~/portfolio-deployment/.docker

            # Pull the latest code
            cd ~/portfolio-deployment
            echo "${{ env.REGISTRY }}" > .registry

            # Create/update environment file
            cat > .env << EOF
            REGISTRY=${{ env.REGISTRY }}
            ROOT_DOMAIN=${{ secrets.ROOT_DOMAIN }}
            CF_API_TOKEN=${{ secrets.CF_API_TOKEN }}
            ZONE_ID=${{ secrets.ZONE_ID }}
            CLOUDFLARE_TUNNEL_TOKEN=${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
            EOF

            # Copy the docker-compose file content
            cat > .docker/compose.yaml << 'EOF'
            services:
              svnfrs-cloudflare-tunnel:
                container_name: svnfrs-cloudflare-tunnel
                image: cloudflare/cloudflared
                restart: unless-stopped
                command: tunnel run
                profiles:
                  - prod
                environment:
                  - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
                networks:
                  - svnfrs-traefik-internal

              svnfrs-traefik:
                container_name: svnfrs-traefik
                image: traefik:v2.10
                restart: always
                command:
                  - "--log"
                  - "--entrypoints.web.address=:80"
                  - "--entrypoints.websecure.address=:443"
                  - "--api.dashboard=true"
                  - "--api.insecure=true"
                  - "--providers.docker=true"
                  - "--providers.docker.exposedbydefault=false"
                  - "--log.level=${LOG_LEVEL:-INFO}"
                  - "--accesslog=true"
                  - "--serversTransport.insecureSkipVerify=true"
                ports:
                  - "80:80"
                  - "443:443"
                profiles:
                  - prod
                volumes:
                  - "/var/run/docker.sock:/var/run/docker.sock"
                environment:
                  - CF_DNS_API_TOKEN=${CF_API_TOKEN}
                networks:
                  - svnfrs-networks
                  - svnfrs-traefik-internal

              svnfrs-cloudflare-companion:
                container_name: svnfrs-cloudflare-companion
                image: ghcr.io/tiredofit/docker-traefik-cloudflare-companion:latest
                volumes:
                  - /var/run/docker.sock:/var/run/docker.sock
                environment:
                  - TIMEZONE=Asia/Ho_Chi_Minh
                  - LOG_TYPE=CONSOLE
                  - LOG_LEVEL=INFO
                  - TRAEFIK_VERSION=2
                  - RC_TYPE=CNAME
                  - TARGET_DOMAIN=${ROOT_DOMAIN}
                  - REFRESH_ENTRIES=TRUE
                  - ENABLE_TRAEFIK_POLL=TRUE
                  - TRAEFIK_POLL_URL=http://svnfrs-traefik/api
                  - TRAEFIK_FILTER_LABEL=traefik.constraint
                  - TRAEFIK_FILTER=proxy-public
                  - CF_TOKEN=${CF_API_TOKEN}
                  - DOMAIN1=${ROOT_DOMAIN}
                  - DOMAIN1_ZONE_ID=${ZONE_ID}
                  - DOMAIN1_PROXIED=TRUE
                restart: always
                networks:
                  - svnfrs-traefik-internal
                profiles:
                  - prod

              svnfrs-portfolio:
                container_name: svnfrs-portfolio
                image: ${REGISTRY}/svnfrs-portfolio:latest
                restart: always
                labels:
                  - "traefik.enable=true"
                  - "traefik.docker.network=svnfrs-networks"
                  - "traefik.constraint=proxy-public"
                  - "traefik.http.routers.svnfrs-portfolio.rule=Host(\`${ROOT_DOMAIN}\`)"
                  - "traefik.http.routers.svnfrs-portfolio.entrypoints=web"
                  - "traefik.http.services.svnfrs-portfolio.loadbalancer.server.port=3000"
                networks:
                  svnfrs-networks:
                profiles:
                  - prod

            networks:
              svnfrs-networks:
                name: svnfrs_networks
                driver: bridge
              svnfrs-traefik-internal:
                name: svnfrs_traefik_internal
                driver: bridge
            EOF

            # Verify Docker is installed and running
            if ! command -v docker &> /dev/null; then
              echo "Docker not found. Installing Docker..."
              sudo apt update
              sudo apt install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
              sudo systemctl start docker
              sudo systemctl enable docker
              sudo usermod -aG docker $USER
              echo "Docker installed. You may need to log out and back in for group changes to take effect."
            fi

            # Verify socket permissions
            if [ ! -S /var/run/docker.sock ]; then
              echo "Docker socket not found. Checking if Docker is running..."
              sudo systemctl status docker
              echo "Attempting to start Docker..."
              sudo systemctl start docker
            fi

            # Check if we can access Docker without sudo
            if ! docker info &> /dev/null; then
              echo "Using sudo for Docker commands due to permission issues..."

              # Login to GitHub Container Registry with sudo
              echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin

              # Pull and deploy with sudo
              sudo docker compose -f .docker/compose.yaml -p svnfrs-portfolio --profile prod pull
              sudo docker compose -f .docker/compose.yaml -p svnfrs-portfolio --profile prod up -d

              # Clean up with sudo
              sudo docker system prune -af
            else
              # Normal flow if permissions are correct
              echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
              docker compose -f .docker/compose.yaml -p svnfrs-portfolio --profile prod pull
              docker compose -f .docker/compose.yaml -p svnfrs-portfolio --profile prod up -d
              docker system prune -af
            fi
